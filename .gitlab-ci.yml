image: node:latest

stages:
  - install
  - test
  - build
  - package 
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/

install_dependencies:
  stage: install
  script:
    - echo "=== Installation des packages ==="
    - npm ci --cache .npm --prefer-offline
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
    policy: pull-push

run_tests:
  stage: test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
    policy: pull
  script:
    - echo "=== Exécution des tests automatisés ==="
    - npm test -- --watchAll=false --passWithNoTests 

build_project:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
    policy: pull
  script:
    - echo "=== Compilation de l'application (Build) ==="
    - export CI=false && npm run build
  artifacts:
    name: "frontend-build-$CI_COMMIT_REF_SLUG"
    expire_in: 1 week
    paths:
      - build/

build_docker_image:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HUB_REPO: "vanessamagne2010/front-imc"
  script:
    - echo "=== Connexion à Docker Hub ==="
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin

    - echo "=== Construction de l'image Docker ==="
    - docker build -t $DOCKER_HUB_REPO:$CI_COMMIT_REF_SLUG -t $DOCKER_HUB_REPO:latest .
    
    - echo "=== Envoi des images sur Docker Hub ==="
    - docker push $DOCKER_HUB_REPO:$CI_COMMIT_REF_SLUG
    - docker push $DOCKER_HUB_REPO:latest
  dependencies:
    - build_project
  only:
    - main

deploy:
  stage: deploy
  script:
    - echo "=== Fin du pipeline CI/CD ==="
    - echo "L'image est prête sur Docker Hub et peut être déployée."